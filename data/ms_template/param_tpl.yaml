
# === Required parameters ===
Required:
  # raw ms data path
  rawFilePath: ./tests/codetest/rawFilePath
  
  # linear and circular reference
  fastaFilePath_linear: ./Ref/uniprotkb_AND_reviewed_true_AND_model_o_2024_11_29.fasta
  fastaFilePath_circ: ./Ref/circ_BT.fasta
  
  # MaxQuant mapar.xml template path
  template: ./data/ms_template/param_tpl.yaml

  # expriement design file
  exp_design: ./exp_design.txt


# === Optional parameters ===
Defaults:
  # !!! you need to check the relative path !!! 

  # MaxQuant project name, it is recorded in mqpar.xml - <name>
  projectName: my_test

  # maxquant path 
  mq_cmd: ./pkgs/MaxQuant_v2.6.7.0/bin/MaxQuantGui.dll

  # msconvert path
  pwiz_path: ./pkgs/pwiz/msconvert

  # ThermoRawFileParser path
  trfp: ./pkgs/trfp/ThermoRawFileParser.exe
  
  # scan filter paramters
  pep_thresh: 0.01
  score_thresh: 40

  # num of threads
  threads: 40

# === MaxQuant search settings ===
Recommended:
  enzymes: 
    - Trypsin
  fixedModifications: 
    - Carbamidomethyl (C)
  variableModifications:
    - Oxidation (M)
    - Acetyl (Protein N-term)
  maxMissedCleavages: 2
  firstSearchTol: 20
  mainSearchTol: 5
  minPeptideLength_linear: 7
  minPeptideLength_circ: 5
  minRatioCount: 2
  
  # enable lable-free quantification: true/false
  enable_lfq: false